name: backend

on:
  pull_request:
    branches: [v1-build]
    paths:
      - "backend/**"
      - "clients/openapi.json"
      - "clients/fixtures/**"
      - "justfile"
      - ".github/workflows/backend.yml"

jobs:
  gate-expensive:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feed_the_goose
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d feed_the_goose"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/feed_the_goose
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install just
        run: uv tool install rust-just==1.59.0

      - name: Install Python and dependencies
        run: uv python install && uv sync --frozen

      - name: Migrate
        run: just migrate

      - name: Run gate-expensive
        run: just gate-expensive

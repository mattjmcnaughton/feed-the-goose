name: GooseSpike
options:
  bundleIdPrefix: dev.spike.goose
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"
targets:
  GooseSpike:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UIAppFonts: [Shrikhand-Subset.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.spike.goose.app
    dependencies:
      - target: GooseWidgetExtension
  GooseSpikeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GooseSpike
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GooseSpike
  GooseWidgetExtension:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Goose
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [Shrikhand-Subset.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.spike.goose.app.widget
